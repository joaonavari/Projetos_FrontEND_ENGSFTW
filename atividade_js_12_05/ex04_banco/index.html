<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 04: Infinity Bank</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>💳 Simulador Infinity Bank</h2>
        <p>Calcule as taxas e parcelas da transação.</p>
        
        <div class="form-group">
            <label for="valor">Valor da Venda (R$)</label>
            <input type="number" id="valor" step="0.01" min="0" placeholder="Ex: 1500.00">

            <label for="bandeira">Bandeira do Cartão</label>
            <select id="bandeira">
                <option value="selecione" disabled selected>Escolha a bandeira...</option>
                <option value="visa">Visa (2%)</option>
                <option value="master">Mastercard (1.85%)</option>
                <option value="elo">Elo (3%)</option>
            </select>

            <label for="parcelas">Número de Parcelas</label>
            <input type="number" id="parcelas" min="1" max="24" placeholder="Ex: 12">

            <button id="btnSimular">Simular Venda</button>
        </div>
        
        <div id="resultado" class="oculto">
            <h3>Resumo da Transação</h3>
            <div class="resumo-item">
                <span>Taxa da Bandeira:</span>
                <strong id="resTaxa" class="texto-vermelho"></strong>
            </div>
            <div class="resumo-item">
                <span>Juros (0.35% a.m.):</span>
                <strong id="resJuros" class="texto-vermelho"></strong>
            </div>
            <div class="resumo-item">
                <span>Taxa Mensal Fixa (R$ 12,50):</span>
                <strong id="resFixa" class="texto-vermelho"></strong>
            </div>
            <hr>
            <div class="resumo-item destaque">
                <span>Valor de cada Parcela:</span>
                <strong id="resParcela" class="texto-azul"></strong>
            </div>
            <div class="resumo-item">
                <span>Valor Total a Pagar:</span>
                <strong id="resTotal"></strong>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
