<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 02: Conversor Dinâmico</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>🌡️ Conversor de Temperatura</h2>
        <p>Digite um valor para converter em tempo real.</p>
        
        <div class="input-group">
            <div class="input-box">
                <label for="celsius">Celsius (°C)</label>
                <input type="number" id="celsius" step="0.1" placeholder="Ex: 25">
            </div>
            
            <div class="icone-troca">
                <span>⇄</span>
            </div>

            <div class="input-box">
                <label for="fahrenheit">Fahrenheit (°F)</label>
                <input type="number" id="fahrenheit" step="0.1" placeholder="Ex: 77">
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
