<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 01: Validador de CPF</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Validador de CPF</h2>
        <p>Digite um CPF para verificar sua validade.</p>
        
        <div class="input-group">
            <input type="text" id="cpfInput" placeholder="Ex: 000.000.000-00" maxlength="14">
            <button onclick="verificarCPF()">Validar</button>
        </div>
        
        <div id="resultado"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
